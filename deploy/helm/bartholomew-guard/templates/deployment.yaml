apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-guard
  labels:
    app.kubernetes.io/name: bartholomew-guard
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: bartholomew-guard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bartholomew-guard
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
      containers:
        - name: guard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: BTP_SOVEREIGN_MODE
              value: "true"
            - name: BTP_TELEMETRY_EGRESS
              value: "{{ .Values.telemetry.egress }}"
            - name: BTP_AST_MAX_LATENCY_US
              value: "{{ .Values.ast.maxLatencyUs }}"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
