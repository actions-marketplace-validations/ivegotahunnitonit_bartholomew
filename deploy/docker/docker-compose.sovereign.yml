version: '3.8'

# Bartholomew Sovereign Zero-Trust Agent Guard Gateway
# Air-gapped local execution with 0 WAN phone-home telemetry.
# Sub-35us in-process AST safety gate and secret vault redaction.

services:
  bartholomew-guard:
    image: ghcr.io/ivegotahunnitonit/bartholomew:v6.3.0
    container_name: bartholomew-guard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - BTP_PORT=8080
      - BTP_SOVEREIGN_MODE=true
      - BTP_TELEMETRY_EGRESS=disabled
      - BTP_AST_MAX_LATENCY_US=35
      - BTP_SECRET_MASKING=enabled
      - BTP_PASSPORT_ALGO=ED25519
    volumes:
      - ./config:/etc/btp:ro
      - ./logs:/var/log/btp:rw
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
