name: 'Bartholomew Keystone Security Guard'
description: 'In-process sub-35µs AST safety gate, secret scrubber, and compliance validator for AI agent repositories.'
author: 'Bartholomew Security'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  enforce:
    description: 'Enforcement mode (fail-closed or audit-only)'
    required: false
    default: 'fail-closed'
  export-audit:
    description: 'Export SOC 2 / ISO 27001 compliance audit receipt'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '>=18'

    - name: Run Bartholomew Auto-Pilot Audit
      shell: bash
      run: |
        npx --yes btp-guard intel --json > btp_intel_report.json
        npx --yes btp-guard scan-deps
        if [ "${{ inputs.export-audit }}" = "true" ]; then
          npx --yes btp-guard audit-export BARTHOLOMEW_SOC2_AUDIT.md
        fi

    - name: Verify Posture Gate
      shell: bash
      run: |
        SCORE=$(node -e "const r = JSON.parse(require('fs').readFileSync('btp_intel_report.json')); console.log(r.score || 0);")
        echo "Bartholomew Workspace Posture Score: $SCORE / 100"
        if [ "$SCORE" -lt 75 ] && [ "${{ inputs.enforce }}" = "fail-closed" ]; then
          echo "::error::Bartholomew Security Gate Failed: Repository posture score ($SCORE) is below required 75 threshold."
          exit 1
        fi
