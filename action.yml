name: 'Bartholomew Agent Guard CI/CD Audit'
description: 'Zero-trust AST safety gate, prompt injection detection, and 20-vector red-team audit for autonomous agent directives.'
author: 'Bartholomew Sovereign Trust Authority'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  scan-paths:
    description: 'Comma-separated file paths or glob patterns to audit (e.g. .cursorrules, CLAUDE.md, GEMINI.md)'
    required: false
    default: '.cursorrules, CLAUDE.md, GEMINI.md, .cursor/rules, copilot-instructions.md, .agents'
  fail-on-exploit:
    description: 'Whether to fail the CI build if vulnerabilities or prompt injections are found'
    required: false
    default: 'true'
  output-format:
    description: 'Output format (markdown, json, summary)'
    required: false
    default: 'markdown'

outputs:
  score:
    description: 'Resilience score out of 100'
  passed:
    description: 'Whether the agent directives passed zero-trust invariant checks'
  merkle-root:
    description: 'RFC 8785 Ed25519 canonical Merkle root hash for the audit'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run Bartholomew Agent Guard Audit
      shell: bash
      env:
        SCAN_PATHS: ${{ inputs.scan-paths }}
        FAIL_ON_EXPLOIT: ${{ inputs.fail-on-exploit }}
      run: |
        python ${{ github.action_path }}/scripts/run_ci_agent_audit.py
