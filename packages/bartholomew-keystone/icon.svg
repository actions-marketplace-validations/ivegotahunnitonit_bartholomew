<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="kBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0a1a"/>
      <stop offset="50%" stop-color="#140f2b"/>
      <stop offset="100%" stop-color="#07050e"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="kGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="1024" height="1024" rx="220" fill="url(#kBg)"/>
  <rect width="1016" height="1016" x="4" y="4" rx="216" fill="none" stroke="#2d244f" stroke-width="8"/>

  <!-- Glowing Crest / Keystone Shape -->
  <polygon points="512,140 840,310 740,780 512,900 284,780 184,310" fill="#181233" stroke="url(#keyGrad)" stroke-width="14" filter="url(#kGlow)"/>

  <!-- Center Cryptographic Passkey -->
  <g transform="translate(512, 500) scale(1.35)">
    <!-- Key Head (Ring) -->
    <circle cx="-60" cy="-60" r="100" fill="none" stroke="url(#keyGrad)" stroke-width="28"/>
    <circle cx="-60" cy="-60" r="50" fill="none" stroke="#38bdf8" stroke-width="12"/>

    <!-- Key Shaft -->
    <path d="M 12 12 L 140 140" stroke="url(#keyGrad)" stroke-width="32" stroke-linecap="round"/>

    <!-- Key Bit Teeth (Clearance notches) -->
    <path d="M 80 80 L 110 50" stroke="url(#keyGrad)" stroke-width="26" stroke-linecap="round"/>
    <path d="M 115 115 L 155 75" stroke="url(#keyGrad)" stroke-width="26" stroke-linecap="round"/>
    <path d="M 130 130 L 160 100" stroke="url(#keyGrad)" stroke-width="22" stroke-linecap="round"/>
  </g>

  <!-- Bottom Badge: KEYSTONE -->
  <rect x="312" y="770" width="400" height="64" rx="32" fill="#0b0817" stroke="url(#keyGrad)" stroke-width="4"/>
  <text x="512" y="812" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, monospace" font-size="28" font-weight="800" letter-spacing="8" text-anchor="middle">KEYSTONE</text>
</svg>