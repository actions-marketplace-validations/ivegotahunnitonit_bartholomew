<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradK" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1026"/>
      <stop offset="100%" stop-color="#060610"/>
    </linearGradient>
    <linearGradient id="kCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16183a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0c0d20" stop-opacity="0.95"/>
