  </defs>

  <rect width="900" height="520" fill="url(#bgGradK)" rx="12"/>
  <rect width="898" height="518" x="1" y="1" fill="none" stroke="#2e2b52" stroke-width="1.5" rx="11"/>

  <!-- Top Bar -->
  <g transform="translate(24, 24)">
    <circle cx="20" cy="20" r="16" fill="url(#purpleGlow)"/>
    <path d="M 16 14 C 18 12 22 12 24 14 C 26 16 26 20 24 22 L 28 26 L 25 29 L 22 26 L 19 29 L 16 26 C 14 24 14 16 16 14 Z" fill="#0b0c1c"/>
    <text x="50" y="20" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="16" font-weight="700">BARTHOLOMEW KEYSTONE</text>
