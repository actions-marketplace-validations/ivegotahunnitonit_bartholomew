    <!-- Armed Status Pill -->
    <rect x="670" y="8" width="180" height="28" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <circle cx="686" cy="22" r="4" fill="#34d399"/>
    <text x="698" y="26" fill="#34d399" font-family="Consolas, monospace" font-size="11" font-weight="700">[PASSKEY: ARMED]</text>
  </g>

  <!-- Passkey Overview Cards -->
  <g transform="translate(24, 86)">
    <!-- Passkey ID -->
    <rect width="202" height="88" rx="8" fill="url(#kCardGrad)" stroke="#2e2b52"/>
    <text x="16" y="24" fill="#64748b" font-family="Consolas, monospace" font-size="10" font-weight="700">ACTIVE PASSKEY ID</text>
    <text x="16" y="58" fill="#a5b4fc" font-family="Consolas, monospace" font-size="18" font-weight="700">pk_8f3a9e1b2c4d</text>
    <text x="16" y="76" fill="#34d399" font-family="Consolas, monospace" font-size="10">HMAC-SHA256 verified</text>

    <!-- Agent ID -->
    <g transform="translate(216, 0)">
      <rect width="202" height="88" rx="8" fill="url(#kCardGrad)" stroke="#2e2b52"/>
      <text x="16" y="24" fill="#64748b" font-family="Consolas, monospace" font-size="10" font-weight="700">BOUND AGENT ID</text>
      <text x="16" y="58" fill="#38bdf8" font-family="Consolas, monospace" font-size="18" font-weight="700">agent-dev-01</text>
      <text x="16" y="76" fill="#64748b" font-family="Consolas, monospace" font-size="10">Developer Sandbox preset</text>
    </g>

    <!-- Spend Ceiling -->
    <g transform="translate(432, 0)">
      <rect width="202" height="88" rx="8" fill="url(#kCardGrad)" stroke="#2e2b52"/>
      <text x="16" y="24" fill="#64748b" font-family="Consolas, monospace" font-size="10" font-weight="700">SESSION SPEND CEILING</text>
      <text x="16" y="58" fill="#34d399" font-family="Consolas, monospace" font-size="20" font-weight="700">$25.00 <tspan font-size="12" fill="#64748b">USD</tspan></text>
      <text x="16" y="76" fill="#64748b" font-family="Consolas, monospace" font-size="10">Single txn cap: $10.00</text>
    </g>

    <!-- TTL Remaining -->
    <g transform="translate(648, 0)">
      <rect width="204" height="88" rx="8" fill="url(#kCardGrad)" stroke="#2e2b52"/>
      <text x="16" y="24" fill="#64748b" font-family="Consolas, monospace" font-size="10" font-weight="700">EXPIRATION TTL</text>
      <text x="16" y="58" fill="#f8fafc" font-family="Consolas, monospace" font-size="20" font-weight="700">1h 58m</text>
      <text x="16" y="76" fill="#34d399" font-family="Consolas, monospace" font-size="10">Auto-revokes on expiry</text>
    </g>
  </g>

  <!-- Scopes Deep Dive Matrix -->
  <g transform="translate(24, 190)">
    <rect width="852" height="305" rx="8" fill="url(#kCardGrad)" stroke="#2e2b52"/>
    <text x="16" y="26" fill="#c084fc" font-family="Consolas, monospace" font-size="11" font-weight="700">CRYPTOGRAPHIC CLEARANCE BOUNDARIES (.btp_keystone.json)</text>
    <line x1="16" y1="36" x2="836" y2="36" stroke="#2e2b52"/>

    <!-- Filesystem Scope -->
    <g transform="translate(16, 48)">
      <text x="0" y="16" fill="#818cf8" font-family="Consolas, monospace" font-size="12" font-weight="700">[1] FILESYSTEM SCOPES</text>
      <rect x="0" y="26" width="820" height="42" rx="4" fill="#090a18" stroke="#1f2142"/>
      <text x="12" y="44" fill="#34d399" font-family="Consolas, monospace" font-size="10.5">ALLOW_WRITE : ["src/**", "tests/**", "docs/**"]</text>
      <text x="12" y="60" fill="#f87171" font-family="Consolas, monospace" font-size="10.5">DENY_GLOBS  : [".env*", "secrets*", "id_rsa*", "id_ed25519*", ".git/hooks/**"]</text>
    </g>

    <!-- Command Scope -->
    <g transform="translate(16, 126)">
      <text x="0" y="16" fill="#818cf8" font-family="Consolas, monospace" font-size="12" font-weight="700">[2] COMMAND SANDBOXING SCOPES</text>
      <rect x="0" y="26" width="820" height="42" rx="4" fill="#090a18" stroke="#1f2142"/>
      <text x="12" y="44" fill="#34d399" font-family="Consolas, monospace" font-size="10.5">ALLOW_EXEC  : ["npm test", "pytest", "python -m unittest", "cargo check", "git status"]</text>
      <text x="12" y="60" fill="#f87171" font-family="Consolas, monospace" font-size="10.5">DENY_EXEC   : ["rm", "sudo", "curl | sh", "wget", "chmod", "mkfs", "dd"] (Deny Shell Ops: ON)</text>
    </g>

    <!-- Network & Budget -->
    <g transform="translate(16, 204)">
      <text x="0" y="16" fill="#818cf8" font-family="Consolas, monospace" font-size="12" font-weight="700">[3] NETWORK &amp; VELOCITY BUDGET GOVERNOR</text>
      <rect x="0" y="26" width="820" height="42" rx="4" fill="#090a18" stroke="#1f2142"/>
      <text x="12" y="44" fill="#38bdf8" font-family="Consolas, monospace" font-size="10.5">ALLOW_DOMAINS : ["github.com", "npmjs.org", "pypi.org", "docs.python.org", "localhost"]</text>
      <text x="12" y="60" fill="#fbbf24" font-family="Consolas, monospace" font-size="10.5">BUDGET CAPS   : Max Spend: $25.00 | Single Txn: $10.00 | Token Velocity: 250k tok/min</text>
    </g>

    <text x="16" y="292" fill="#64748b" font-family="Consolas, monospace" font-size="10">SUB-15us HMAC-SHA256 SIGNED CLEARANCE TOKEN // IMMUTABLE &amp; TAMPER-EVIDENT</text>
  </g>
</svg>
