name: Bartholomew Runtime Protection & AST Invariant Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  bartholomew-security-audit:
    name: "BTP v5.4.23 AST Invariant & Compliance Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Bartholomew Security Gate
        uses: ./
        with:
          scan-path: "."
          fail-on-violation: "true"
          spend-cap: "50.0"
