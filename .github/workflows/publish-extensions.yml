name: Publish IDE Extensions

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish · VS Code Marketplace & Open-VSX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          npm install -g @vscode/vsce ovsx
          npm install --prefix packages/vscode-extension --no-audit --no-fund
          npm install --prefix packages/bartholomew-keystone --no-audit --no-fund
          python -m pip install --upgrade pip

      - name: Package Latest VSIX Bundles
        run: |
          python scripts/package_all_vsix.py

      - name: Publish to Marketplaces
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        shell: bash
        run: |
          args=()
          if [ -n "$VSCE_PAT" ]; then
            args+=(--vsce-pat "$VSCE_PAT")
          fi
          if [ -n "$OVSX_PAT" ]; then
            args+=(--ovsx-pat "$OVSX_PAT")
          fi
          if [ ${#args[@]} -eq 0 ]; then
            echo "[ERROR] Neither VSCE_PAT nor OVSX_PAT is configured. Publishing is intentionally blocked."
            exit 1
          fi
          python scripts/publish_extensions.py "${args[@]}"
