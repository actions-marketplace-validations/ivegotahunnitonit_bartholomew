name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges | head -30)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Install package dependencies
        run: |
          npm install --prefix packages/vscode-extension --no-audit --no-fund
          npm install --prefix packages/bartholomew-keystone --no-audit --no-fund

      - name: Build IDE Extensions (.vsix)
        run: |
          python scripts/package_all_vsix.py

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "BTP v${{ steps.version.outputs.VERSION }}"
          files: |
            packages/bartholomew-keystone/bartholomew-keystone-${{ steps.version.outputs.VERSION }}.vsix
            packages/vscode-extension/bartholomew-guard-vscode-${{ steps.version.outputs.VERSION }}.vsix
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.CHANGELOG }}

            ---

            **IDE Extensions Included:**
            - `bartholomew-keystone-${{ steps.version.outputs.VERSION }}.vsix` (Agent Capability Passkey clearance)
            - `bartholomew-guard-vscode-${{ steps.version.outputs.VERSION }}.vsix` (AST Invariant Gate & Dispatch Seam)

            **SDK Install:**
            ```bash
            pip install btp-guard==${{ steps.version.outputs.VERSION }}
            # or
            npx btp-guard@${{ steps.version.outputs.VERSION }} init
            ```

            **Full Changelog:** https://github.com/${{ github.repository }}/compare/${{ steps.changelog.outputs.PREV_TAG }}...${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false

