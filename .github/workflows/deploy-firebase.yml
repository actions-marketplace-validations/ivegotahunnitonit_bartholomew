name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'firebase.json'
      - '.github/workflows/deploy-firebase.yml'
  workflow_dispatch:

concurrency:
  group: hosting-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_and_deploy:
    name: Validate Manifests & Deploy to Firebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Validate JSON Manifests & Security Specs
        run: |
          python3 -c "
          import json
          files = [
              'site/agent-manifest.json',
              'site/.well-known/agent-manifest.json',
              'site/.well-known/agent-protocol.json',
              'site/.well-known/btp.json',
              'site/openapi.json',
              'firebase.json'
          ]
          for f in files:
              with open(f, 'r', encoding='utf-8') as fh:
                  data = json.load(fh)
              print(f'✓ Validated {f}')
          print('All agent manifests, schemas, and firebase configs verified successfully.')
          "

      - name: Verify Core Site Production Artifacts
        run: |
          test -f site/index.html || { echo 'Missing site/index.html'; exit 1; }
          test -f site/docs.html || { echo 'Missing site/docs.html'; exit 1; }
          test -f site/sim-lab.html || { echo 'Missing site/sim-lab.html'; exit 1; }
          test -f site/telemetry.html || { echo 'Missing site/telemetry.html'; exit 1; }
          test -f site/verify.html || { echo 'Missing site/verify.html'; exit 1; }
          test -f site/llms.txt || { echo 'Missing site/llms.txt'; exit 1; }
          test -f site/llms-full.txt || { echo 'Missing site/llms-full.txt'; exit 1; }
          test -f site/robots.txt || { echo 'Missing site/robots.txt'; exit 1; }
          echo "All production artifacts verified."

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            firebase deploy --only hosting --token "$FIREBASE_TOKEN" --non-interactive
          else
            echo "::notice ::FIREBASE_TOKEN not set in repository secrets. Pre-flight verification passed 100%."
          fi
