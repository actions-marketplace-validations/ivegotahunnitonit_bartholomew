name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  #  Python Security Gate 
  python:
    name: Python ${{ matrix.python-version }}  Security Gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography pyyaml pytest pytest-timeout fastapi httpx requests uvicorn
          pip install -e .

      - name: Run test suite
        env:
          PYTHONPATH: src:.
        run: |
          python -m pytest \
            tests/test_real_security_boundary.py \
            tests/test_billing_and_entitlements.py \
            tests/test_pilot_xss_and_conversion.py \
            tests/test_execution_paths_and_truthful_gates.py \
            tests/test_truthful_proof_provider.py \
            tests/test_extension_command_handling.py \
            tests/test_cloud_engine_server.py \
            tests/test_pre_commit_enforcement.py \
            tests/test_authorization_gate_mvp.py \
            tests/test_v31_agent_passport_and_discovery.py \
            tests/test_m2m_benchmark_and_manifest.py \
            tests/test_delegation_and_reputation.py \
            tests/test_dispute_and_replay.py \
            tests/test_framework_integrations.py \
            tests/test_community_integrations.py \
            tests/test_compliance_dossier_export.py \
            tests/test_enterprise_polish_and_metering.py \
            tests/test_universal_agent_protector.py \
            tests/test_cli_linter.py \
            --timeout=60 \
            --tb=short \
            -q

  #  Lint & Type Check 
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: pip install ruff

      - name: Ruff lint
        run: ruff check src/ tests/ --output-format=github

  #  Node / MCP Gate 
  node:
    name: Node.js  MCP & SDK Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & test npm package
        run: |
          cd packages/npm_package
          npm ci || npm install
          npm test

      - name: Compile VS Code extension
        run: |
          cd packages/vscode-extension
          npm ci || npm install
          npm run compile

  #  Go Verifier 
  go:
    name: Go  Verifier & Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run Go tests
        run: |
          if [ -d "packages/sdk_go" ]; then
            cd packages/sdk_go
            go test -v ./... -timeout 60s
          elif [ -d "src/go_verifier" ]; then
            cd src/go_verifier
            go test -v ./... -timeout 60s || true
          fi
